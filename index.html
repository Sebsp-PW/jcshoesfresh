<title>JCShoeFresh Lab | Limpieza, impermeabilización y desinfección de tenis</title>
<meta name="description" content="Escríbenos por WhatsApp o síguenos en Instagram y TikTok. Limpieza, impermeabilización y desinfección de calzado.">

<meta property="og:title" content="JCShoeFresh Lab">
<meta property="og:description" content="Limpieza, impermeabilización y desinfección de tenis.">
<meta property="og:type" content="website">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --black: #000000;
    --panel: #050806;
    --neon: #2bf45a;
    --neon-soft: rgba(43, 244, 90, .45);
    --neon-faint: rgba(43, 244, 90, .12);
    --white: #ffffff;
    --muted: #b4c2b8;
    --font: "Montserrat", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    background-color: var(--black);
    background-image:
      linear-gradient(var(--neon-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--neon-faint) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: center top;
    font-family: var(--font);
    color: var(--white);
    line-height: 1.4;
  }
  /* marco de neón: igual al borde del reverso de la tarjeta */
  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 28px 22px 26px;
    background: var(--panel);
    border: 2px solid var(--neon);
    border-radius: 18px;
    box-shadow:
      0 0 0 1px rgba(43, 244, 90, .15),
      0 0 14px var(--neon-soft),
      0 0 46px rgba(43, 244, 90, .22),
      inset 0 0 22px rgba(43, 244, 90, .14);
    animation: switch-on 1.1s steps(1, end) both;
  }
  .logo-wrap { display: flex; justify-content: center; }
  .logo-wrap img {
    display: block;
    width: min(100%, 330px);
    height: auto;
    mix-blend-mode: screen;
  }
  .tagline {
    margin: 10px auto 26px;
    max-width: 30ch;
    text-align: center;
    font-size: .95rem;
    font-weight: 500;
    color: var(--muted);
  }
  .links { list-style: none; display: grid; gap: 14px; }
  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border: 2px solid var(--neon);
    border-radius: 14px;
    color: var(--white);
    text-decoration: none;
    background: transparent;
    box-shadow: 0 0 10px rgba(43, 244, 90, .35), inset 0 0 10px rgba(43, 244, 90, .12);
    transition: background-color .18s ease, box-shadow .18s ease, transform .18s ease, color .18s ease;
  }
  .link svg { flex: none; width: 30px; height: 30px; color: var(--neon); transition: color .18s ease; }
  .link .text { display: flex; flex-direction: column; min-width: 0; }
  .link .title { font-weight: 700; font-size: 1.05rem; letter-spacing: .01em; }
  .link .sub { font-weight: 500; font-size: .9rem; color: var(--muted); transition: color .18s ease; overflow-wrap: anywhere; }

  /* WhatsApp es la acción principal: tubo encendido */
  .link.primary {
    background: var(--neon);
    color: #00140a;
    box-shadow: 0 0 16px var(--neon-soft), 0 0 36px rgba(43, 244, 90, .3);
  }
  .link.primary svg, .link.primary .sub { color: #00140a; }

  .link:hover, .link:focus-visible {
    background: rgba(43, 244, 90, .16);
    box-shadow: 0 0 18px var(--neon), 0 0 40px rgba(43, 244, 90, .35), inset 0 0 14px rgba(43, 244, 90, .25);
    transform: translateY(-2px);
  }
  .link.primary:hover, .link.primary:focus-visible {
    background: #5dff82;
    color: #00140a;
  }
  .link:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
  .link:active { transform: translateY(0); }

  .foot { margin-top: 22px; text-align: center; font-size: .8rem; color: var(--muted); }

  @keyframes switch-on {
    0%   { opacity: .15; box-shadow: none; }
    8%   { opacity: 1; }
    14%  { opacity: .25; }
    22%  { opacity: 1; }
    30%  { opacity: .4; }
    40%, 100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .link { transition: none; }
    .link:hover, .link:focus-visible { transform: none; }
  }
  @media (max-width: 380px) {
    .card { padding: 22px 16px 22px; }
    .link { padding: 12px 14px; gap: 12px; }
  }
</style>
